version: '3.8'

services:
  pdf_unlocker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: client_pdf_unlocker_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Client PDF Unlocker
      - APP_ENV=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-default-production-secret-key-please-replace-min-32-chars}
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - MAX_FILE_SIZE_MB=50
      - MAX_FILES_PER_JOB=500
      - WORKER_COUNT=4
      - RETENTION_MINUTES=30
      - DATABASE_URL=sqlite:///./data/pdf_unlocker.db
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-Admin@12345}
      - DEFAULT_STAFF_USERNAME=${DEFAULT_STAFF_USERNAME:-staff}
      - DEFAULT_STAFF_PASSWORD=${DEFAULT_STAFF_PASSWORD:-Staff@12345}
    volumes:
      - pdf_data:/app/data
      - pdf_temp:/app/temp_jobs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pdf_data:
    driver: local
  pdf_temp:
    driver: local
